services:
  # Unified Web Service: Hosts both Backend and Frontend together on a single URL
  - type: web
    name: the-gardening-assistant
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GEMMA_MODE
        value: local
